[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hushfile"
version = "0.1.0"
description = "HushFile - Drop it in Downloads, forget it, find it later. Local open-weight AI file organizer with crash-safe undo journal."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AntKss07" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "watchdog>=3.0.0",
    "httpx>=0.25.0",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.0.0"
]
ui = [
    "streamlit>=1.30.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0"
]

[project.scripts]
hushfile = "butler.cli:app"
butler = "butler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
